name: Run Test Suite

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "profile-data.json"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Verify Dashboard Generator Dry Run
        run: |
          python scripts/generate_dashboard.py
