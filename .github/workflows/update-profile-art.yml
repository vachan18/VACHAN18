name: Update profile art

"on":
  schedule:
    # Every 2 hours, at :47 IST on odd hours (5:47, 7:47, ...).
    # No [skip ci] in the bot commit below: a [skip ci] head commit on main
    # can stop GitHub from firing scheduled runs at all.
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile-data.json"
      - "data/ascii.txt"
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contributions and repo stats
        env:
          # Optional repo secret: a fine-grained/classic PAT so private contributions count.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, graph, activity, tiles, repos)
        run: python scripts/render_readme_cards.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898284+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
